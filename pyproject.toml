[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "citizen-appeals-agent"
version = "0.1.0"
description = "Research prototype of an AI agent that classifies citizen appeals and monitors their SLA deadlines in business days."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Laura Kazikhanova" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "matplotlib>=3.7",
]
keywords = ["smart city", "text classification", "SLA", "business days", "research software"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
    "build>=1.2",
]

[project.scripts]
appeal-agent = "appeal_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
appeal_agent = ["data/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["appeal_agent"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "C4"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib.*", "matplotlib.*"]
ignore_missing_imports = true
