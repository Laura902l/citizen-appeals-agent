apiVersion: apps/v1
kind: Deployment
metadata:
  name: citizen-appeals-agent
  namespace: citizen-appeals
  labels:
    app: citizen-appeals-agent
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: citizen-appeals-agent
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: citizen-appeals-agent
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: app
          image: docker.io/lrknva/citizen-appeals-agent:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /api/summary
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/summary
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
