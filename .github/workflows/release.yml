# Continuous Delivery: pushing a version tag (e.g. v0.1.0) builds the package,
# re-runs the tests and the reproducible experiment, and publishes a GitHub
# Release with the wheel, the source distribution, the experiment reports and
# the built web dashboard.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install
        run: pip install -e ".[dev]"
      - name: Check that the tag matches the package version
        run: |
          VERSION=$(python -c "import appeal_agent; print(appeal_agent.__version__)")
          test "v$VERSION" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} != v$VERSION"; exit 1; }
      - name: Tests
        run: pytest --cov --cov-fail-under=90
      - name: Build wheel and sdist
        run: python -m build
      - name: Build dashboard
        run: |
          cd dashboard && npm ci && npm test && npm run build
          cd dist && zip -r ../../dashboard-dist.zip .
      - name: Reproduce experiment
        run: |
          appeal-agent generate --n 2000 --seed 42 --out data/appeals.csv
          appeal-agent train --data data/appeals.csv --seed 42 --min-accuracy 0.90
          appeal-agent monitor --data data/appeals.csv --today 2026-10-05
          cd reports && zip -r ../experiment-reports.zip .
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*
            experiment-reports.zip
            dashboard-dist.zip
